name: Publish Zero1Local v1.3.0 Beta installer

on:
  push:
    paths:
      - ".github/workflows/publish-v130-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zero1local-v130-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      TAG: v1.3.0
      FILENAME: Zero1Local-v1.3.0-production.zip
      EXPECTED_SHA256: 986a1a5ec2a906fe23d94e796fa50203339f4851701ebc79d1f082fc708604c2
    steps:
      - name: Check out public distribution repository
        uses: actions/checkout@v4

      - name: Reconstruct verified binary candidate from Git objects
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-package"
          OUT="$RUNNER_TEMP/release-package/$FILENAME"
          : > "$OUT"
          # Only public installer binary slices are staged in the Git object store,
          # not source code or secrets. No 8MB ZIP is committed to main.
          BLOBS=(
            c01d9ca65b10cf81167fb36142ebb627422e2435
            b11057cd583f62edfca92238450a9a771a28ab59
            6866cb96cb9f2179da8c8d2bbedb9be7a19b01b1
            cd4d365802255b43a954f3c00d285a8ef92bd240
            ac83579265456086f05888abfcda5530ff4d806e
            cba6a02ad020793e49fffaf2539ed85a5a519af5
            071bc1f88375259716deb5979891d69a6a981e33
            990c27e2037a91d1a6f20a31c9ba99ecddcddbfa
            803a11c1779acfc9bede4a7293279195e0570149
            5ed82661ded1f44db4273df893725d25ad8df52e
            e147b7febe836ef3df694acfc0aceb653483e14d
          )
          count=0
          for sha in "${BLOBS[@]}"; do
            gh api "repos/$GH_REPOSITORY/git/blobs/$sha" --jq '.content' |
              base64 --decode >> "$OUT"
            count=$((count+1))
          done
          [[ $count -eq 11 ]]
          [[ $(stat -c %s "$OUT") -eq 8194795 ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$OUT" | sha256sum -c -
          unzip -t "$OUT" >/dev/null
          echo "Exact production candidate reconstructed and verified."

      - name: Publish prerelease and verify freshly downloaded GitHub asset
        shell: bash
        run: |
          set -Eeuo pipefail
          PKG="$RUNNER_TEMP/release-package/$FILENAME"
          if gh release view "$TAG" --repo "$GH_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; checking exact published asset and prerelease status."
          else
            gh release create "$TAG" "$PKG" \
              --repo "$GH_REPOSITORY" \
              --title "Zero1Local v1.3.0 (Beta release candidate)" \
              --notes-file docs/releases/v1.3.0-beta.md \
              --prerelease \
              --target main
          fi
          gh api "repos/$GH_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$FILENAME" "$EXPECTED_SHA256" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: obj=json.load(f)
          assert obj.get("prerelease") is True and obj.get("draft") is False, "Release must remain a public prerelease"
          assets=[x for x in obj["assets"] if x["name"]==sys.argv[2]]
          assert len(assets)==1, "Expected exactly one production ZIP asset"
          assert assets[0].get("digest")==f"sha256:{sys.argv[3]}", "Published GitHub asset digest mismatch"
          assert assets[0].get("size")==8194795, "Published asset size mismatch"
          print("GitHub asset metadata VERIFIED:",obj["html_url"])
          PY
          mkdir -p "$RUNNER_TEMP/verify-download"
          gh release download "$TAG" --repo "$GH_REPOSITORY" \
            --pattern "$FILENAME" --dir "$RUNNER_TEMP/verify-download"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/verify-download/$FILENAME" | sha256sum -c -
          {
            echo "## Published and verified v1.3.0 Beta"
            echo ""
            echo "[GitHub prerelease](https://github.com/$GH_REPOSITORY/releases/tag/$TAG)"
            echo ""
            echo "- Asset: \`$FILENAME\`"
            echo "- Size: 8,194,795 bytes"
            echo "- SHA-256: \`$EXPECTED_SHA256\`"
            echo "- Verified freshly downloaded published asset"
            echo "- Channel: **Beta prerelease**, not Stable; NAS qualification pending"
          } >> "$GITHUB_STEP_SUMMARY"
