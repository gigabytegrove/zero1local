name: Publish Zero1Local v1.3.0 Beta installer

on:
  push:
    paths:
      - ".github/workflows/publish-v130-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zero1local-v130-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      TAG: v1.3.0
      FILENAME: Zero1Local-v1.3.0-production.zip
      EXPECTED_SHA256: 561e9c4259caeaf6c6da6e3dca176d30e8321e0dc79bae29bdb59ac5fcdd4267
    steps:
      - name: Check out public distribution repository
        uses: actions/checkout@v4

      - name: Reconstruct verified binary candidate from Git objects
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-package"
          OUT="$RUNNER_TEMP/release-package/$FILENAME"
          : > "$OUT"
          # Only public installer binary slices are staged in the Git object store,
          # not source code or secrets. No 8MB ZIP is committed to main.
          BLOBS=(
            f8fe8a94aac0eab3ae8bf9e0ca072a6857652e2d
            f1cb48a01171558e950349e8e530b8532cb0664b
            f8daf7dbf87e67be908f4cb78906453161b9d465
            a306026f932a426166a5a1b93220daa1d383eb86
            423dffc1f3ca6ca664cafe89c555d8e6657e74c3
            651a419881a1218b4368d531b121abc2c54706f3
            88d57d9db6d278c159bb89032a32d9da8a92af88
            baad5b7b52bfcaf860e1042cf9e46cecf6d77b1f
            56a748f4c67597ea4d6a86c3f30a072b071a5779
            3e69978ef12da852896e9a6378e5fcbf3b1da9bc
            8c0b57419a41d4f748576c68b83c58ea1b10d45d
            530f8aa60f5fad206421d54911e1687f8609ae57
            5fba2e0f504dca4ff034a923cd433dea8de02e82
            744341b59cedd3bb5f4037e419e4cda9358f219d
            2cc8839eff8a59cb38d423447270f3950367d8dd
            1e3c15a5389acdcdbc88c73227972115fd14ac63
            39cb5290489db898e6b7f1a02387cb748b06417f
            3a7246d52a91ae40a15c1182f305d6d6926bdd2e
            2fe24aa482c969e66588d61b91526be517db3dd4
            adffbc2beb3b168d3e944f45adc6815b7e4ca0e4
            ec69088171aa153839f065089bd9f5fc6b9ac717
          )
          count=0
          for sha in "${BLOBS[@]}"; do
            gh api "repos/$GH_REPOSITORY/git/blobs/$sha" --jq '.content' |
              base64 --decode >> "$OUT"
            count=$((count+1))
          done
          [[ $count -eq 21 ]]
          [[ $(stat -c %s "$OUT") -eq 7943158 ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$OUT" | sha256sum -c -
          unzip -t "$OUT" >/dev/null
          python3 .github/scripts/verify-production-package.py "$OUT" --version 1.3.0
          echo "Corrected production candidate rebuilt, scanned and verified."

      - name: Publish prerelease and verify freshly downloaded GitHub asset
        shell: bash
        run: |
          set -Eeuo pipefail
          PKG="$RUNNER_TEMP/release-package/$FILENAME"
          if gh release view "$TAG" --repo "$GH_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; checking exact published asset and prerelease status."
          else
            gh release create "$TAG" "$PKG" \
              --repo "$GH_REPOSITORY" \
              --title "Zero1Local v1.3.0 (Beta release candidate)" \
              --notes "Beta release candidate, rebuilt from private Zero1Local source commit 55c6a2fe0bbdaca79ce2e4713f2dbc51e9a2a3fa.

Fix: prevent Go HTTP ServeMux startup panic (GET / conflicting with retired /api/connect/).
Native Google Drive/OAuth and experimental Zero1Connect remote API are not available. Syncria integration is planned for future development only.
Includes rebuilt ARM64 server and recovery binaries, vetted scripts and verified production ZIP.
Not yet hardware-qualified: verify upgrade, rollback, data preservation, and management health on a test NAS before stable promotion.

Production ZIP SHA-256: 561e9c4259caeaf6c6da6e3dca176d30e8321e0dc79bae29bdb59ac5fcdd4267" \
              --prerelease \
              --target main
          fi
          gh api "repos/$GH_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$FILENAME" "$EXPECTED_SHA256" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: obj=json.load(f)
          assert obj.get("prerelease") is True and obj.get("draft") is False, "Release must remain a public prerelease"
          assets=[x for x in obj["assets"] if x["name"]==sys.argv[2]]
          assert len(assets)==1, "Expected exactly one production ZIP asset"
          assert assets[0].get("digest")==f"sha256:{sys.argv[3]}", "Published GitHub asset digest mismatch"
          assert assets[0].get("size")==7943158, "Published asset size mismatch"
          print("GitHub asset metadata VERIFIED:",obj["html_url"])
          PY
          mkdir -p "$RUNNER_TEMP/verify-download"
          gh release download "$TAG" --repo "$GH_REPOSITORY" \
            --pattern "$FILENAME" --dir "$RUNNER_TEMP/verify-download"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/verify-download/$FILENAME" | sha256sum -c -
          {
            echo "## Published and verified v1.3.0 Beta"
            echo ""
            echo "[GitHub prerelease](https://github.com/$GH_REPOSITORY/releases/tag/$TAG)"
            echo ""
            echo "- Asset: \`$FILENAME\`"
            echo "- Size: 7,943,158 bytes"
            echo "- SHA-256: \`$EXPECTED_SHA256\`"
            echo "- Verified freshly downloaded published asset"
            echo "- Channel: **Beta prerelease**, not Stable; NAS qualification pending"
          } >> "$GITHUB_STEP_SUMMARY"
