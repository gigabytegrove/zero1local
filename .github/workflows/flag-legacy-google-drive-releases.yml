name: Flag historical Zero1Local Google Drive archives

on:
  push:
    paths:
      - ".github/workflows/flag-legacy-google-drive-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flag-legacy-zero1local-releases
  cancel-in-progress: false

jobs:
  flag-legacy-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Annotate the published legacy release pages (preserving history)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          marker = "<!-- zero1local-legacy-google-drive-archive-v1 -->"
          prefix = (
              marker + "\n"
              "> **Historical Zero1Local package — legacy Google Drive integration.** "
              "This release's production ZIP is **not** a verified Google-Drive-free build. "
              "The native integration is being retired; Google Drive synchronization is planned "
              "for the separate **Syncria companion (Coming soon)**. "
              "Do not choose this archive for a new deployment. "
              "See [legacy release retirement](https://github.com/" + repo +
              "/blob/main/docs/LEGACY-RELEASE-RETIREMENT.md).\n\n"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Zero1Local-release-archive-audit",
          }

          def api(path, method="GET", payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              extra = dict(headers)
              if body is not None:
                  extra["Content-Type"] = "application/json"
              request = urllib.request.Request(base + path, data=body, headers=extra, method=method)
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise
                      time.sleep(2 ** attempt)

          updated = 0
          scanned = 0
          page = 1
          while True:
              batch = api(f"/releases?per_page=100&page={page}")
              if not isinstance(batch, list):
                  raise RuntimeError("GitHub returned an unexpected release list")
              if not batch:
                  break
              for release in batch:
                  if release.get("draft"):
                      continue
                  assets = release.get("assets") or []
                  if not any(a.get("name", "").startswith("Zero1Local-v") and
                             a.get("name", "").endswith("-production.zip") for a in assets):
                      continue
                  scanned += 1
                  body = release.get("body") or ""
                  if marker in body:
                      continue
                  api(f"/releases/{release['id']}", "PATCH", {"body": prefix + body})
                  print("Annotated", release.get("tag_name"))
                  updated += 1
              page += 1
          print(f"Legacy release audit: scanned={scanned} updated={updated}")
          PY
