name: Retire superseded Zero1Local production ZIPs

on:
  push:
    paths:
      - ".github/workflows/retire-superseded-production-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-superseded-zero1local-assets
  cancel-in-progress: false

jobs:
  retire-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove only the inventoried superseded GitHub Release ZIP assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          if repo != "gigabytegrove/zero1local":
              raise RuntimeError("Unexpected target repository: " + repo)
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          KEEP_TAG = "v1.2.9.15"
          KEEP_ASSET = "Zero1Local-v1.2.9.15-production.zip"
          KEEP_DIGEST = "sha256:9c417c3249d15f7ea1698d2dee6e874567f9ccd7c1519d5c02bd858c78b625eb"
          # Frozen inventory from 2026-10-13. New/unlisted assets are never deleted.
          EXPECTED = json.loads(r'''[{"tag":"v1.2.4.19","name":"Zero1Local-v1.2.4.19-production.zip","digest":"sha256:6e9e1c6b459dbdb9b26fd0f0dc527b99728ca3e4f770e729ccf967d62f34eaab"},{"tag":"v1.2.4.22","name":"Zero1Local-v1.2.4.22-production.zip","digest":"sha256:eedbb900e0a154f27fc0ebb9c1ca9f0a7ef3de3a0d3256fa0075ab277c5f118c"},{"tag":"v1.2.4.23","name":"Zero1Local-v1.2.4.23-production.zip","digest":"sha256:08a05d9cdb9311067cf766710e8a784cff547d7f912268a81c60b67aa85af947"},{"tag":"v1.2.4.24","name":"Zero1Local-v1.2.4.24-production.zip","digest":"sha256:4c0588faca5a82ed136d679b120151f606d4105dff11ad587fa2cc5c9d3761e9"},{"tag":"v1.2.4.25","name":"Zero1Local-v1.2.4.25-production.zip","digest":"sha256:532c5000013b72b7f30f4fdd362fb0f11c1b9917db3e73b88793ef6cbbab1170"},{"tag":"v1.2.4.26","name":"Zero1Local-v1.2.4.26-production.zip","digest":"sha256:ce8448f76431bc1c3e24f0ae7f9cf8092a79f9e85e26da3562bf58ef51ca4340"},{"tag":"v1.2.4.27","name":"Zero1Local-v1.2.4.27-production.zip","digest":"sha256:7375ceb3d4b9901323dce571cbc20a7b8f7fe5012dbedf945ffa4ca894fc09a6"},{"tag":"v1.2.5","name":"Zero1Local-v1.2.5-production.zip","digest":"sha256:265da26c17c4ba1b150560a1210a5315dbe890cd03604a5cdfc02ee995a5e7d1"},{"tag":"v1.2.5.1","name":"Zero1Local-v1.2.5.1-production.zip","digest":"sha256:7972108b4cb09b481fa3a559901a4864a23e5349ff0c4f30db57d8d2e4f62e66"},{"tag":"v1.2.5.2","name":"Zero1Local-v1.2.5.2-production.zip","digest":"sha256:86d894cf2b7350d46e9ff67ae0b4526748ac64e3de0d78289566305d56af5bd0"},{"tag":"v1.2.5.3","name":"Zero1Local-v1.2.5.3-production.zip","digest":"sha256:83b10a5d2606cf3165ccef7c34dbd887c6ac5a7dd7e08457073610d4d7a50474"},{"tag":"v1.2.5.4","name":"Zero1Local-v1.2.5.4-production.zip","digest":"sha256:ead1dacf8e7ab091c8073fc0c8fbd4d3daeea44b58d8a3dc397b6048f9a3dd3d"},{"tag":"v1.2.6","name":"Zero1Local-v1.2.6-production.zip","digest":"sha256:adcaa2d4a493dd25de6973a3b01536b572202063be2b8978ca2c51a0c05f8c3f"},{"tag":"v1.2.6.1","name":"Zero1Local-v1.2.6.1-production.zip","digest":"sha256:9d9186a27bcd47a4bd9bf9c5c3c0792d6a63bae804927840f27db511908e6075"},{"tag":"v1.2.6.2","name":"Zero1Local-v1.2.6.2-production.zip","digest":"sha256:f15f10c863e8764263e2e8fd57d5f2fecc726a18ba4508af957aeff0d975dcbf"},{"tag":"v1.2.6.3","name":"Zero1Local-v1.2.6.3-production.zip","digest":"sha256:e532c69d8c3948874e3958d3cdd69d66ae3eec50a92b1c392069a033c7c60835"},{"tag":"v1.2.6.4","name":"Zero1Local-v1.2.6.4-production.zip","digest":"sha256:af2e83c8fa5b69e3c0a95e4560b5002e05944bdfbfd008b618aee5ccef935e28"},{"tag":"v1.2.6.5","name":"Zero1Local-v1.2.6.5-production.zip","digest":"sha256:4f4c818f2f77c8c82ab8ef27fc582636e1acc55fc3bcd0ac4524c10ffc3bc28d"},{"tag":"v1.2.6.6","name":"Zero1Local-v1.2.6.6-production.zip","digest":"sha256:99cc73d8c137aea5163a49cd231544c4c16f230d60af0b03c20206e91e782b96"},{"tag":"v1.2.6.7","name":"Zero1Local-v1.2.6.7-production.zip","digest":"sha256:42f82a669b92b82346172d7d6ab5ebcfb463847e5fd1f094b3d62a15bf95a6a6"},{"tag":"v1.2.7.0","name":"Zero1Local-v1.2.7.0-production.zip","digest":"sha256:dd73f776ac1127a1be52333c5f6d30e45ebb0317196130d2b15d522c4c48fa71"},{"tag":"v1.2.8","name":"Zero1Local-v1.2.8-production.zip","digest":"sha256:5a7560a7ee9ff6b287163b6163361a9c6e2f16b2dc8bb94bcb719d466ab8a404"},{"tag":"v1.2.9","name":"Zero1Local-v1.2.9-production.zip","digest":"sha256:ff64b0e06e3592cb9aa71478b5b1f8ad5f65c8bd34968092f2c14cdd41fda58b"},{"tag":"v1.2.9.1","name":"Zero1Local-v1.2.9.1-production.zip","digest":"sha256:5d9ed310bbd667c4533846c8e001a413aa5d67e96024c20ce3fc52acfe4e2766"},{"tag":"v1.2.9.2","name":"Zero1Local-v1.2.9.2-production.zip","digest":"sha256:add84977f21dbe2861f11759218c90f25b48b0f64c1bf8afd6df4cc05b64e5da"},{"tag":"v1.2.9.3","name":"Zero1Local-v1.2.9.3-production.zip","digest":"sha256:e0763d2d20d3c8e40db5785e6a2d7ce8f5913f53e43052d433965c32f38c55e3"},{"tag":"v1.2.9.4","name":"Zero1Local-v1.2.9.4-production.zip","digest":"sha256:0758ac0d45d23b2efb5cd92c455c2edd48aba2ccf53013c682cf24bbf2189ae8"},{"tag":"v1.2.9.5","name":"Zero1Local-v1.2.9.5-production.zip","digest":"sha256:1d5b1a1d4ea11bc6de5630dd0d12148fb101e9410396fc6b4c8c92caba80acc3"},{"tag":"v1.2.9.6","name":"Zero1Local-v1.2.9.6-production.zip","digest":"sha256:921ed277fe4517d7bd42cb0ca23b4a087a993ccb96fe22fb77536ec4abf94936"},{"tag":"v1.2.9.7","name":"Zero1Local-v1.2.9.7-production.zip","digest":"sha256:66383cf125db576ce81d7fd356093e12bde137a36814894fe0bb1445aa1cb496"},{"tag":"v1.2.9.8","name":"Zero1Local-v1.2.9.8-production.zip","digest":"sha256:c0e7c42692c532f0d876a40096e9d5cfde04889651a16a047623b14e83aae5c6"},{"tag":"v1.2.9.10","name":"Zero1Local-v1.2.9.10-production.zip","digest":"sha256:7cbc918b8f658b636dd7294a4e1bfc288b9bb5295dedf75acb6fe320f5cd6e0a"},{"tag":"v1.2.9.11","name":"Zero1Local-v1.2.9.11-production.zip","digest":"sha256:c4e7fe4b7318b7486aa39cadbc93ee9fb80d37a52487367b6a6b6cf7577f1a7a"},{"tag":"v1.2.9.12","name":"Zero1Local-v1.2.9.12-production.zip","digest":"sha256:7b2c6166a0800600618ef48c6dd12cebc67f4426809dc5f02c1eeae9217ab3c4"},{"tag":"v1.2.9.13","name":"Zero1Local-v1.2.9.13-production.zip","digest":"sha256:20c77399099b76b33d8bde9b9396890838a223c1d122d846c2d23e7f432206b5"},{"tag":"v1.2.9.14","name":"Zero1Local-v1.2.9.14-production.zip","digest":"sha256:46294a922e1319ea36424d451ad31dc833c49223e92e9732181dbf714c7d349d"}]''')
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Zero1Local-release-retirement",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          raw = response.read()
                          return json.loads(raw.decode()) if raw else None
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 4:
                          raise
                      time.sleep(2 ** attempt)

          def releases():
              page = 1
              found = []
              while True:
                  batch = api(f"/releases?per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise RuntimeError("Unexpected GitHub Releases API response")
                  if not batch:
                      return {x["tag_name"]: x for x in found}
                  found.extend(batch)
                  page += 1

          all_releases = releases()
          current = all_releases.get(KEEP_TAG)
          if not current or current.get("draft") or current.get("prerelease"):
              raise RuntimeError("Required current stable release missing or not stable")
          live = [a for a in current.get("assets", []) if a["name"] == KEEP_ASSET]
          if len(live) != 1 or live[0].get("digest") != KEEP_DIGEST:
              raise RuntimeError("Current stable ZIP missing or changed; declining to remove any legacy ZIP")

          if len(EXPECTED) != 36:
              raise RuntimeError("Legacy inventory must contain exactly 36 entries")

          # Preflight every item BEFORE deleting anything. On rerun, already
          # retired ZIPs are accepted, but extra/nonmatching assets are not touched.
          targets = []
          for record in EXPECTED:
              release = all_releases.get(record["tag"])
              if not release:
                  raise RuntimeError(f"Missing release {record['tag']}; preflight stopped")
              assets = [a for a in release.get("assets", []) if a["name"] == record["name"]]
              if len(assets) > 1:
                  raise RuntimeError(f"Duplicate historical asset {record['name']}")
              if assets and assets[0].get("digest") != record["digest"]:
                  raise RuntimeError(f"Checksum changed on {record['tag']}; preflight stopped")
              if assets:
                  targets.append((record["tag"], assets[0]["id"]))

          print(f"Preflight passed: {len(EXPECTED)} legacy tags, {len(targets)} ZIP assets still published")
          for tag, asset_id in targets:
              api(f"/releases/assets/{asset_id}", method="DELETE")
              print("Retired production ZIP for", tag)

          final = releases()
          for record in EXPECTED:
              obj = final.get(record["tag"])
              if not obj:
                  raise RuntimeError("Historical release page disappeared: " + record["tag"])
              if any(a.get("name") == record["name"] for a in obj.get("assets", [])):
                  raise RuntimeError("Legacy asset remains: " + record["name"])
          keep = final.get(KEEP_TAG)
          if not keep or not any(
              a.get("name") == KEEP_ASSET and a.get("digest") == KEEP_DIGEST
              for a in keep.get("assets", [])
          ):
              raise RuntimeError("Current stable installer missing after cleanup")

          print("VERIFIED: 36 historical production ZIP assets absent; current stable ZIP retained.")
          PY
