name: Bug report
description: Report a reproducible Zero1Local problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: {label: Zero1Local version}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Appliance / environment, description: "Hardware, architecture, OS/runtime, browser, and deployment details."}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What happened?}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant sanitized logs}
